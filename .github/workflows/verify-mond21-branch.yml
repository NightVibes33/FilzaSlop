name: Verify isolated Mond 2.1 Filza build

on:
  push:
    branches: [ mond-2.1-verify ]
  workflow_dispatch:

concurrency:
  group: verify-mond21-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-build:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MOND_COMMIT: 500d76082f0ca021ddd591c05d129ebbc26c20df
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout exact validation tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify clean Mond 2.1 integration contract
        run: |
          set -euxo pipefail
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          grep -Fq "MOND_COMMIT=\"$MOND_COMMIT\"" scripts/stage-mond-current.sh
          grep -Fq "$MOND_COMMIT" ThirdParty/mond/UPSTREAM.md
          grep -Fq 'MondCurrentAppState.shared' FilzaMondCurrentHost.swift
          grep -Fq 'UserDefaults.standard.register(defaults: ["method": "bad_query"])' FilzaMondCurrentHost.swift
          grep -Fq 'grant_all(state: state)' FilzaMondCurrentHost.swift
          grep -Fq 'full Mond 2.1 route installed commit=500d76082f0ca021ddd591c05d129ebbc26c20df' FilzaMondBridge.m
          ! test -e MondIOS27KeySupport.swift
          ! test -e scripts/patch-mond-ios27-keys.sh
          ! test -e scripts/patch-mond-token-button.sh

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install pinned Theos
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Build pinned idevice FFI
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a

      - name: Build pinned SSH stack
        run: |
          set -euxo pipefail
          bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"
          test "$(cat Vendor/ssh/LIBSSH_COMMIT)" = "$LIBSSH_COMMIT"
          test "$(cat Vendor/ssh/MBEDTLS_COMMIT)" = "$MBEDTLS_COMMIT"
          test -s Vendor/ssh/lib/libssh.a

      - name: Compile complete arm64 Filza dylib with Mond 2.1
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:17.0

          grep -Fxq "mond=$MOND_COMMIT" ThirdParty/mond-current/PINNED.txt
          grep -Fq '@StateObject private var state = AppState.shared' ThirdParty/mond-current/Upstream/mond.swift
          grep -Fq 'UserDefaults.standard.register(defaults: ["method": "bad_query"])' ThirdParty/mond-current/Upstream/mond.swift
          grep -Fq 'private static func cache_extra' ThirdParty/mond-current/Upstream/helpers/mg.swift
          grep -Fq 'func cache_data_safe_offset' ThirdParty/mond-current/Upstream/helpers/mg.swift
          grep -Fq 'state.pb_granted = false' ThirdParty/mond-current/Upstream/exploit/unsbx.swift
          grep -Fq 'static let shared = AppState()' ThirdParty/mond-current/Upstream/helpers/utils.swift
          ! grep -R -Fq 'FILZA_IOS27_GESTALT_KEYS_BEGIN' ThirdParty/mond-current/Generated/Mond
          ! grep -R -Fq 'lastFreshToken' ThirdParty/mond-current/Generated/Mond

          DYLIB=.theos/obj/FilzaApplySandboxExt.dylib
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = arm64
          grep -aFq 'constructed exact Mond 2.1 root at 500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          grep -aFq 'full Mond 2.1 route installed commit=500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          grep -aFq 'Run Exploit' "$DYLIB"
          grep -aFq 'Generate Token' "$DYLIB"
          grep -aFq 'Explore Tendies' "$DYLIB"
          ! grep -aFq 'Fresh sandbox token issued successfully. Mond has not consumed it.' "$DYLIB"
          shasum -a 256 "$DYLIB" | tee .theos/MOND21-DYLIB-SHA256.txt

      - name: Prove Filza app version anchor during packaging
        run: |
          set -euxo pipefail
          mkdir -p .theos/validation-ipa
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/validation-ipa/base.ipa
          echo "$BASE_IPA_SHA256  .theos/validation-ipa/base.ipa" | shasum -a 256 -c -
          unzip -q .theos/validation-ipa/base.ipa -d .theos/validation-ipa/stage
          APP="$(find .theos/validation-ipa/stage/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          plutil -replace CFBundleShortVersionString -string '4.11' "$APP/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = '4.11'
          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          OUTPUT="$GITHUB_WORKSPACE/.theos/Filza-Mond-2.1-validation-unsigned.ipa"
          (cd .theos/validation-ipa/stage && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          shasum -a 256 "$OUTPUT" | tee .theos/MOND21-IPA-SHA256.txt

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Mond-2.1-validation
          path: |
            .theos/Filza-Mond-2.1-validation-unsigned.ipa
            .theos/MOND21-DYLIB-SHA256.txt
            .theos/MOND21-IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
            ThirdParty/mond/UPSTREAM.md
          if-no-files-found: error
          retention-days: 14
