name: Mond 2.0 contract diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      MOND_COMMIT: 87b38b2726160c6d1cfacbbfa834a2572d7ca333
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose every Mond 2.0 invariant
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          REPORT="$RUNNER_TEMP/mond-contract-results.txt"
          : > "$REPORT"
          report() { echo "$*" | tee -a "$REPORT"; }
          check() {
            local name="$1"
            shift
            if "$@"; then
              report "PASS: $name"
            else
              report "FAIL: $name"
              failed=1
            fi
          }
          absent() {
            local path="$1"
            if test ! -e "$path"; then
              report "PASS: absent $path"
            else
              report "FAIL: stale file exists $path"
              failed=1
            fi
          }

          check upstream_pin grep -Fq "$MOND_COMMIT" ThirdParty/mond/UPSTREAM.md
          check stage_pin grep -Fq "$MOND_COMMIT" scripts/stage-mond-2.0.sh
          check build_pin grep -Fq "$MOND_COMMIT" scripts/build-mond-2.0-embedded.sh
          check host_pin grep -Fq "$MOND_COMMIT" Mond2EmbeddedHost.swift
          check bundle_anchor grep -Fq 'bundle identifier `com.apple.mobile.MobileHouseArrest`' ThirdParty/mond/UPSTREAM.md
          check version_anchor grep -Fq 'marketing version `4.11`' ThirdParty/mond/UPSTREAM.md
          check make_target grep -Fq 'TARGET := iphone:clang:latest:16.0' Makefile

          absent FilzaMondCurrentHost.swift
          absent MondFullRootHost.swift
          absent MondGestaltView.swift
          absent MondIOS27KeySupport.swift
          absent scripts/stage-mond-current.sh
          absent scripts/patch-mond-ios27-keys.sh
          absent scripts/patch-mond-token-button.sh

          overlay_marker='FILZA_'"IOS27_GESTALT_KEYS_BEGIN"
          token_marker='Fresh sandbox token issued successfully. Mond has not consumed'" it."
          if git grep -Fn "$overlay_marker" -- ':!.github/workflows/*' >> "$REPORT"; then
            report 'FAIL: old iOS27 overlay marker remains outside workflows'
            failed=1
          else
            report 'PASS: no old iOS27 overlay marker outside workflows'
          fi
          if git grep -Fn "$token_marker" -- ':!.github/workflows/*' >> "$REPORT"; then
            report 'FAIL: old token rewrite marker remains outside workflows'
            failed=1
          else
            report 'PASS: no old token rewrite marker outside workflows'
          fi

          for forbidden in 'mond_map =' 'Generated/Mond' 're.sub(' 'write_text(' 'lastFreshToken'; do
            if grep -Fq "$forbidden" scripts/stage-mond-2.0.sh; then
              report "FAIL: staging rewrite marker: $forbidden"
              failed=1
            else
              report "PASS: staging has no rewrite marker: $forbidden"
            fi
          done

          cp "$REPORT" mond-contract-results.txt
          exit "$failed"
      - name: Upload Mond contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mond-2-contract-results
          path: mond-contract-results.txt
          if-no-files-found: error
          retention-days: 1
