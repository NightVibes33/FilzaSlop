name: Mond 2.0 contract diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      MOND_COMMIT: 87b38b2726160c6d1cfacbbfa834a2572d7ca333
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose every Mond 2.0 invariant
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          check() {
            local name="$1"
            shift
            if "$@"; then
              echo "PASS: $name"
            else
              echo "FAIL: $name"
              failed=1
            fi
          }
          absent() {
            local path="$1"
            if test ! -e "$path"; then
              echo "PASS: absent $path"
            else
              echo "FAIL: stale file exists $path"
              failed=1
            fi
          }

          check upstream_pin grep -Fq "$MOND_COMMIT" ThirdParty/mond/UPSTREAM.md
          check stage_pin grep -Fq "$MOND_COMMIT" scripts/stage-mond-2.0.sh
          check build_pin grep -Fq "$MOND_COMMIT" scripts/build-mond-2.0-embedded.sh
          check host_pin grep -Fq "$MOND_COMMIT" Mond2EmbeddedHost.swift
          check bundle_anchor grep -Fq 'bundle identifier `com.apple.mobile.MobileHouseArrest`' ThirdParty/mond/UPSTREAM.md
          check version_anchor grep -Fq 'marketing version `4.11`' ThirdParty/mond/UPSTREAM.md
          check make_target grep -Fq 'TARGET := iphone:clang:latest:16.0' Makefile

          absent FilzaMondCurrentHost.swift
          absent MondFullRootHost.swift
          absent MondGestaltView.swift
          absent MondIOS27KeySupport.swift
          absent scripts/stage-mond-current.sh
          absent scripts/patch-mond-ios27-keys.sh
          absent scripts/patch-mond-token-button.sh

          if git grep -Fn 'FILZA_IOS27_GESTALT_KEYS_BEGIN'; then
            echo 'FAIL: old iOS27 overlay marker remains'
            failed=1
          else
            echo 'PASS: no old iOS27 overlay marker'
          fi
          if git grep -Fn 'Fresh sandbox token issued successfully. Mond has not consumed it.'; then
            echo 'FAIL: old token rewrite marker remains'
            failed=1
          else
            echo 'PASS: no old token rewrite marker'
          fi

          for forbidden in 'mond_map =' 'Generated/Mond' 're.sub(' 'write_text(' 'FILZA_IOS27_GESTALT_KEYS_BEGIN' 'lastFreshToken'; do
            if grep -Fq "$forbidden" scripts/stage-mond-2.0.sh; then
              echo "FAIL: staging rewrite marker: $forbidden"
              failed=1
            else
              echo "PASS: staging has no rewrite marker: $forbidden"
            fi
          done

          exit "$failed"
