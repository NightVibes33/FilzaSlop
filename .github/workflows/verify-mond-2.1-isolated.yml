name: Verify Exact Mond 2.1 Isolated

on:
  push:
    branches: [ mond-2.1-verify ]
  workflow_dispatch:

concurrency:
  group: verify-mond-2.1-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      MOND_COMMIT: 500d76082f0ca021ddd591c05d129ebbc26c20df
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout exact verification tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify exact Mond 2.1 source contract
        run: |
          set -euxo pipefail
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          grep -Fq "MOND_COMMIT=\"$MOND_COMMIT\"" scripts/stage-mond-current.sh
          grep -Fq "$MOND_COMMIT" ThirdParty/mond/UPSTREAM.md
          grep -Fq 'no Filza behavior/UI patches applied' scripts/stage-mond-current.sh
          grep -Fq 'MondCurrentAppState.shared' FilzaMondCurrentHost.swift
          grep -Fq 'UserDefaults.standard.register(defaults: ["method": "bad_query"])' FilzaMondCurrentHost.swift
          grep -Fq 'grant_all(state: state)' FilzaMondCurrentHost.swift
          grep -Fq 'full Mond 2.1 route installed commit=500d76082f0ca021ddd591c05d129ebbc26c20df' FilzaMondBridge.m
          grep -Fq 'TARGET := iphone:clang:latest:17.0' Makefile
          ! test -e MondIOS27KeySupport.swift
          ! test -e scripts/patch-mond-ios27-keys.sh
          ! test -e scripts/patch-mond-token-button.sh

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Verify pinned SSH stack
        run: |
          set -euxo pipefail
          test "$(cat Vendor/ssh/LIBSSH_COMMIT)" = "$LIBSSH_COMMIT"
          test "$(cat Vendor/ssh/MBEDTLS_COMMIT)" = "$MBEDTLS_COMMIT"
          test -s Vendor/ssh/lib/libssh.a
          test -s Vendor/ssh/lib/libmbedtls.a
          test -s Vendor/ssh/lib/libmbedx509.a
          test -s Vendor/ssh/lib/libmbedcrypto.a
          test "$(lipo -archs Vendor/ssh/lib/libssh.a)" = "arm64"

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Verify pinned Theos
        run: |
          set -euxo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          test -f "$THEOS/makefiles/common.mk"

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Verify pinned idevice FFI
        run: |
          set -euxo pipefail
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

      - name: Build and verify exact Mond 2.1 arm64 target
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:17.0

          grep -Fxq "mond=$MOND_COMMIT" ThirdParty/mond-current/PINNED.txt
          grep -Fq '@StateObject private var state = AppState.shared' ThirdParty/mond-current/Upstream/mond.swift
          grep -Fq 'UserDefaults.standard.register(defaults: ["method": "bad_query"])' ThirdParty/mond-current/Upstream/mond.swift
          grep -Fq 'private static func cache_extra' ThirdParty/mond-current/Upstream/helpers/mg.swift
          grep -Fq 'func cache_data_safe_offset' ThirdParty/mond-current/Upstream/helpers/mg.swift
          grep -Fq 'state.pb_granted = false' ThirdParty/mond-current/Upstream/exploit/unsbx.swift
          grep -Fq 'static let shared = AppState()' ThirdParty/mond-current/Upstream/helpers/utils.swift
          grep -Fq 'private static func cache_extra' ThirdParty/mond-current/Generated/Mond/helpers_mg.swift
          grep -Fq 'state.pb_granted = false' ThirdParty/mond-current/Generated/Mond/exploit_unsbx.swift
          ! grep -R -Fq 'FILZA_IOS27_GESTALT_KEYS_BEGIN' ThirdParty/mond-current/Generated/Mond
          ! grep -R -Fq 'lastFreshToken' ThirdParty/mond-current/Generated/Mond
          ! grep -R -Fq 'Fresh sandbox token issued successfully. Mond has not consumed it.' ThirdParty/mond-current/Generated/Mond

          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          grep -aFq 'MondEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'constructed exact Mond 2.1 root at 500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          grep -aFq 'full Mond 2.1 route installed commit=500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          grep -aFq 'Run Exploit' "$DYLIB"
          grep -aFq 'Generate Token' "$DYLIB"
          grep -aFq 'Your sandbox token is invalid.' "$DYLIB"
          grep -aFq 'Explore Tendies' "$DYLIB"
          grep -aFq 'HouseArrest' "$DYLIB"
          ! grep -aFq 'waiting for Run Exploit' "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Download anchored Filza base IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package and verify anchored Filza 4.11 IPA
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filza-mond21.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"

          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true

          plutil -replace CFBundleShortVersionString -string "4.11" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          bash scripts/merge-3105-app-metadata.sh "$APP/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = "4.11"

          DYLIB="$APP/Frameworks/FilzaApplySandboxExt.dylib"
          grep -aFq 'constructed exact Mond 2.1 root at 500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          grep -aFq 'full Mond 2.1 route installed commit=500d76082f0ca021ddd591c05d129ebbc26c20df' "$DYLIB"
          otool -L "$APP/$EXECUTABLE" | grep -F 'FilzaApplySandboxExt.dylib'

          OUTPUT="$GITHUB_WORKSPACE/.theos/FilzaSlop-Mond-2.1-${GITHUB_SHA::7}-unsigned.ipa"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          shasum -a 256 "$OUTPUT" | tee .theos/MOND21-IPA-SHA256.txt

      - name: Upload exact Mond 2.1 verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-Mond-2.1-verified-arm64
          path: |
            .theos/FilzaSlop-Mond-2.1-*-unsigned.ipa
            .theos/MOND21-IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
            ThirdParty/mond-current/PINNED.txt
            ThirdParty/mond/UPSTREAM.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
