<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Filza 27 feature grid</title>
  <desc id="desc">Six dark glass cards for Filza, Mond 2.1, ByeTunes, 3105, WebDAV and SSH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080e"/><stop offset="1" stop-color="#0a0d14"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141925"/><stop offset="1" stop-color="#0e121b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <text x="76" y="74" fill="#f7f9fc" font-family="Inter,ui-sans-serif,-apple-system,sans-serif" font-size="34" font-weight="800">Everything in one place.</text>
  <text x="76" y="108" fill="#7f8a9e" font-family="Inter,ui-sans-serif,-apple-system,sans-serif" font-size="17">Six integrated surfaces. One verified arm64 package.</text>

  <g transform="translate(76 145)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#8b5cf6" fill-opacity="0.18"/><path d="M38 37h24v5H43v7h17v5H43v11h-5V37Z" fill="#c4b5fd"/><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">Filza</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">filesystem + container browser</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">browse · inspect · import · export</text></g>
  <g transform="translate(505 145)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#8b5cf6" fill-opacity="0.18"/><text x="42" y="55" fill="#c4b5fd" font-family="ui-monospace,Menlo,monospace" font-size="18" font-weight="800">M</text><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">Mond 2.1</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">Gestalt + PosterBoard + Santander</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">pinned upstream · exact source</text></g>
  <g transform="translate(934 145)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#22d3ee" fill-opacity="0.16"/><path d="M46 36v23a8 8 0 1 1-5-7V40l14-3v17a8 8 0 1 1-5-7V36h-4Z" fill="#8deeff"/><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">ByeTunes</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">music library + metadata tooling</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">YouTubeKit · backups · restore</text></g>

  <g transform="translate(76 325)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#8b5cf6" fill-opacity="0.18"/><text x="37" y="55" fill="#c4b5fd" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="800">3105</text><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">3105</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">apps + patch workspace</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">.3105 · receipts · backups</text></g>
  <g transform="translate(505 325)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#22d3ee" fill-opacity="0.16"/><path d="M36 49h28M50 35v28M40 39l20 20M60 39 40 59" stroke="#8deeff" stroke-width="3" stroke-linecap="round"/><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">WebDAV</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">in-process network file server</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">local network · port 11111</text></g>
  <g transform="translate(934 325)"><rect width="390" height="150" rx="26" fill="url(#card)" stroke="#2a3142"/><circle cx="50" cy="48" r="22" fill="#34d399" fill-opacity="0.13"/><text x="36" y="55" fill="#8ff0c5" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="800">&gt;_</text><text x="88" y="48" fill="#fff" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="800">SSH</text><text x="88" y="76" fill="#8893a7" font-family="Inter,ui-sans-serif,sans-serif" font-size="15">embedded libssh server</text><text x="28" y="121" fill="#c7d0de" font-family="ui-monospace,Menlo,monospace" font-size="14">password auth · port 2222</text></g>

  <rect x="76" y="507" width="1248" height="2" rx="1" fill="url(#accent)" opacity="0.55"/>
</svg>
