    <rect x="16" y="16" width="222" height="220" rx="22" fill="#0b0e15" stroke="#202636"/>
    <rect x="34" y="42" width="186" height="20" rx="10" fill="#171d2a"/>
    <rect x="34" y="79" width="82" height="70" rx="16" fill="#171d2a"/>
    <rect x="128" y="79" width="92" height="70" rx="16" fill="#171d2a"/>
    <rect x="34" y="165" width="186" height="18" rx="9" fill="#171d2a"/>
    <rect x="34" y="195" width="128" height="12" rx="6" fill="#171d2a"/>
    <circle cx="57" cy="52" r="5" fill="#8b5cf6"/>
    <circle cx="73" cy="52" r="5" fill="#22d3ee"/>
    <circle cx="89" cy="52" r="5" fill="#34d399"/>
