    <text x="18" y="23" fill="#c6f6ff" font-family="Inter, ui-sans-serif, sans-serif" font-size="14" font-weight="700">FILZA 4.11</text>
  </g>

  <text x="145" y="354" fill="#ffffff" font-family="Inter, ui-sans-serif, -apple-system, sans-serif" font-size="26" font-weight="700">Filza • Mond • ByeTunes • 3105 • WebDAV • SSH</text>
  <text x="145" y="393" fill="#8691a5" font-family="Inter, ui-sans-serif, -apple-system, sans-serif" font-size="17">One sideloadable IPA. One clean interface. Real exact-SHA build verification.</text>

