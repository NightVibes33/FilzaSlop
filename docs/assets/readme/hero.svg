  <text x="265" y="163" fill="url(#titleGrad)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">FILZA 27</text>
  <text x="267" y="204" fill="#aeb7c7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="500">modern iOS filesystem tooling • built for research, sideloading, and experimentation</text>

  <g transform="translate(145 252)">
