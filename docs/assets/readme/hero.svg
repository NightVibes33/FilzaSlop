  <g transform="translate(145 128)">
    <rect width="88" height="88" rx="24" fill="#111525" stroke="#9f7aea" stroke-opacity="0.6"/>
    <path d="M27 24h34v7H34v10h25v7H34v16h-7V24Z" fill="#f8fafc"/>
    <circle cx="68" cy="20" r="5" fill="#22d3ee"/>
