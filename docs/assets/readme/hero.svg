<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Filza 27 hero</title>
  <desc id="desc">Dark glassmorphism hero for Filza 27 with purple and blue glow, feature pills, and verified build styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060b"/>
      <stop offset="0.5" stop-color="#090b14"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.16" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.88" cy="0.72" r="0.82">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.48" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#d8ccff"/>
      <stop offset="1" stop-color="#8deeff"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="620" rx="36" fill="url(#bg)"/>
  <rect width="1400" height="620" rx="36" fill="url(#violet)"/>
  <rect width="1400" height="620" rx="36" fill="url(#cyan)"/>

  <circle cx="220" cy="120" r="130" fill="#7c3aed" opacity="0.18" filter="url(#shadow)"/>
  <circle cx="1210" cy="485" r="150" fill="#06b6d4" opacity="0.14" filter="url(#shadow)"/>

  <g opacity="0.16">
    <circle cx="80" cy="90" r="2" fill="#fff"/><circle cx="180" cy="210" r="1.5" fill="#fff"/><circle cx="310" cy="85" r="1.3" fill="#fff"/>
    <circle cx="1180" cy="115" r="1.7" fill="#fff"/><circle cx="1275" cy="245" r="1.2" fill="#fff"/><circle cx="1080" cy="505" r="1.5" fill="#fff"/>
    <circle cx="570" cy="80" r="1.2" fill="#fff"/><circle cx="760" cy="540" r="1.4" fill="#fff"/><circle cx="920" cy="110" r="1.1" fill="#fff"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="95" y="78" width="1210" height="464" rx="34" fill="#0d1019" fill-opacity="0.78"/>
    <rect x="95.75" y="78.75" width="1208.5" height="462.5" rx="33.25" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
